# Tmux configuration with quality-of-life improvements

# Change prefix key from Ctrl-b to Ctrl-a (easier to reach)
# unbind C-b
# set-option -g prefix C-a
# bind-key C-a send-prefix

# Enable mouse support
set -g mouse on

# Set default terminal to support 256 colors
# set -g default-terminal "screen-256color"
# set -ga terminal-overrides ",*256col*:Tc"

# Increase scrollback buffer size
set -g history-limit 10000

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Faster key repetition
set -s escape-time 0

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity on


# Bell activity
setw -g monitor-bell on
set -g visual-bell off     # don't flash the screen
set -g bell-action other   # only notify for non-current windows

# Window splitting with intuitive keys
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind e split-window -h -c "#{pane_current_path}" $EDITOR
unbind '"'
unbind %

# Pane navigation with vim-like keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane timing 
set -g display-panes-time 3000

# Pane resizing
setw -g aggressive-resize on
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Window navigation
bind -n M-H previous-window
bind -n M-L next-window


# Reload config file
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Copy mode improvements
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle

# Claude commands
bind-key A run-shell 'sh -lc "
curpath=\$(tmux display-message -p \"#{pane_current_path}\")
curpane=\$(tmux display-message -p \"#{pane_id}\")

claudepane=\$(tmux list-panes -F \"#{pane_id}|#{pane_current_command}|#{pane_current_path}\" \
  | awk -F\"|\" -v p=\"\$curpath\" '\''$2==\"claude\" && $3==p {print $1; exit}'\'')

if [ -n \"\$claudepane\" ]; then
  if [ \"\$curpane\" = \"\$claudepane\" ]; then
    tmux last-pane
  else
    tmux select-pane -t \"\$claudepane\"
  fi
else
  tmux split-window -h -p 25 -c \"\$curpath\" \"claude --ide\"
  tmux select-pane -R
fi
"'

# Status bar configuration
# set -g status-position bottom
set -g status-bg colour234
set -g status-fg colour137
set -g status-left ''
# set -g status-right '#[fg=colour233,bg=colour241,bold] %d/%m #[fg=colour233,bg=colour245,bold] %H:%M:%S '
# set -g status-right-length 50
# set -g status-left-length 20
# set -g status-right '#{pane_current_path} #{}' 


# Window status
setw -g window-status-current-format ' #I#[fg=colour250]:#[fg=colour255]#W#[fg=colour50]#F '
setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '

# Pane borders
set -g pane-border-lines single 
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour208

# Message styling
set -g message-style bg=colour235,fg=colour166

# Enable focus events for vim compatibility
set -g focus-events on

# Enable automatic renaming
set-window-option -g automatic-rename on
# Customize the format: Command and Directory
set -g automatic-rename-format '#{pane_current_command} | #{b:pane_current_path}'

# Don't rename windows automatically
#set-option -g allow-rename off

# plugins
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
